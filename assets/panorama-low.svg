.bird--3 { animation: birdDrift 17s ease-in-out infinite; animation-delay: -4s; }
.bird--4 { animation: birdDrift 13s ease-in-out infinite; animation-delay: -7s; }
.bird--5 { animation: birdDrift 19s ease-in-out infinite reverse; animation-delay: -2s; }
@keyframes birdDrift {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(7px, -5px); }
}
</style>
