<style>
.balloon, .kite, .drone { transform-box: fill-box; transform-origin: center; }
.balloon { animation: balloonBob 18s ease-in-out infinite; }
.balloon--2 { animation-duration: 23s; animation-delay: -7s; }
.kite { animation: kiteSway 9s ease-in-out infinite; }
.kite--2 { animation-duration: 12s; animation-delay: -3.5s; }
.drone { animation: droneHover 7s ease-in-out infinite; }
@keyframes balloonBob {
  0%, 100% { transform: translate(0px, 0px) rotate(-0.8deg); }
  50% { transform: translate(7px, -11px) rotate(0.9deg); }
}
@keyframes kiteSway {
  0%, 100% { transform: rotate(-3deg) translate(0px, 0px); }
  50% { transform: rotate(3deg) translate(5px, 4px); }
}
@keyframes droneHover {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(5px, -8px); }
}
</style>
