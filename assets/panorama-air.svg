<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3000" viewBox="0 0 2400 3000" preserveAspectRatio="xMidYMid slice" fill="none">
<g stroke="#1a222e" stroke-width="1.5" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round">

