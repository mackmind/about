  <!-- 6. Near Wing (BROAD AIRBUS WING WITH BLENDED SHARKLET) -->
  <g>
    <!-- Wing aerodynamic base fill with organically blended Sharklet:
         Root chord: (1120, 1812) to (1420, 1826) = 300px broad root!
         Leading edge extends to (1460, 1978), then smoothly sweeps upward into Sharklet (1546, 1865),
         rounds over tip cap to (1561, 1868), and trailing edge sweeps gracefully down into wing trailing edge (1548, 1968)! -->
    <path d="M1120 1812 L1460 1978 C1492 1994 1522 1965 1546 1865 C1548 1856 1558 1858 1561 1868 C1558 1895 1552 1932 1548 1968 L1488 1928 L1424 1876 L1362 1832 L1330 1820 Z" fill="#c9a25a" fill-opacity=".14" stroke-width="2.2"/>

